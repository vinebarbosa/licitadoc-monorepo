services:
  api:
    profiles:
      - api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: licitadoc-api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    ports:
      - "3333:3333"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/licitadoc
      BETTER_AUTH_SECRET: local-container-dev-secret-change-me-please-32-bytes
      BETTER_AUTH_URL: http://localhost:3333
      CORS_ORIGIN: http://localhost:5173
      INVITE_EMAIL_PROVIDER: stub
      TEXT_GENERATION_PROVIDER: stub
      STORAGE_PROVIDER: s3
      STORAGE_S3_ENDPOINT: http://ministack:4566
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_BUCKET: licitadoc-expense-requests
      STORAGE_S3_ACCESS_KEY_ID: test
      STORAGE_S3_SECRET_ACCESS_KEY: test
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      REALTIME_PROVIDER: disabled
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port = process.env.PORT || '3333'; fetch('http://127.0.0.1:' + port + '/health').then(async (response) => { const body = await response.json().catch(() => ({})); if (!response.ok || body.status !== 'ok') process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: licitadoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d licitadoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  ministack:
    image: ministackorg/ministack:1.3
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      LOG_LEVEL: INFO
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      STATE_DIR: /tmp/ministack-state
      S3_DATA_DIR: /tmp/ministack-data/s3
      STORAGE_S3_BUCKET: licitadoc-expense-requests
    volumes:
      - ministack_state:/tmp/ministack-state
      - ministack_s3:/tmp/ministack-data/s3
      - ./infra/ministack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  ministack_state:
  ministack_s3:
