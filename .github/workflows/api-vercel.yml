name: API Vercel CI/CD

on:
  pull_request:
    paths:
      - ".github/workflows/api-vercel.yml"
      - "apps/api/**"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-vercel.yml"
      - "apps/api/**"
      - "package.json"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "turbo.json"
  workflow_dispatch:
    inputs:
      environment:
        description: "Vercel environment to deploy"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: api-vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.0.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  typecheck:
    name: Typecheck API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: pnpm --filter @licitadoc/api typecheck

  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @licitadoc/api build

  test:
    name: Test API
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install --global pnpm@${PNPM_VERSION}

      - name: Resolve pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "${GITHUB_OUTPUT}"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test API
        run: pnpm --filter @licitadoc/api test

  deploy-preview:
    name: Deploy API preview
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview') }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel secrets
        id: vercel_secrets
        run: |
          if [ -n "${VERCEL_TOKEN}" ] && [ -n "${VERCEL_ORG_ID}" ] && [ -n "${VERCEL_PROJECT_ID}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "available=false" >> "${GITHUB_OUTPUT}"
          {
            echo "### Preview deployment skipped"
            echo ""
            echo "Vercel secrets are not available for this workflow run."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Checkout
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        run: |
          npm install --global pnpm@${PNPM_VERSION}
          pnpm_bin_dir="$(dirname "$(command -v pnpm)")"
          echo "PNPM_BIN_DIR=${pnpm_bin_dir}" >> "${GITHUB_ENV}"
          echo "${pnpm_bin_dir}" >> "${GITHUB_PATH}"
          pnpm --version

      - name: Install Vercel CLI
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        run: npm install --global vercel@latest

      - name: Pull Vercel preview settings
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        run: vercel pull --yes --environment=preview --cwd apps/api --token="${VERCEL_TOKEN}"

      - name: Build Vercel preview output
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        run: PATH="${PNPM_BIN_DIR}:${PATH}" vercel build --cwd apps/api --token="${VERCEL_TOKEN}"

      - name: Deploy Vercel preview
        if: ${{ steps.vercel_secrets.outputs.available == 'true' }}
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --cwd apps/api --token="${VERCEL_TOKEN}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Preview deployment"
            echo ""
            echo "${deployment_url}"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-production:
    name: Deploy API production
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && github.ref == 'refs/heads/main') }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check Vercel secrets
        run: |
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "Missing one or more required Vercel secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: |
          npm install --global pnpm@${PNPM_VERSION}
          pnpm_bin_dir="$(dirname "$(command -v pnpm)")"
          echo "PNPM_BIN_DIR=${pnpm_bin_dir}" >> "${GITHUB_ENV}"
          echo "${pnpm_bin_dir}" >> "${GITHUB_PATH}"
          pnpm --version

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --cwd apps/api --token="${VERCEL_TOKEN}"

      - name: Build Vercel production output
        run: PATH="${PNPM_BIN_DIR}:${PATH}" vercel build --prod --cwd apps/api --token="${VERCEL_TOKEN}"

      - name: Deploy Vercel production
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --cwd apps/api --token="${VERCEL_TOKEN}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Production deployment"
            echo ""
            echo "${deployment_url}"
          } >> "${GITHUB_STEP_SUMMARY}"
